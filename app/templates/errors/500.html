{% extends "base.html" %}
{% block title %}Server Error{% endblock %}
{% block content %}
<div class="error-shell" style="min-height: 70vh;">
  <div>
    <div class="error-code">500</div>
    <h4 class="mb-2">Internal Server Error</h4>
    <p class="text-muted">Something went wrong on our end. Please try again shortly.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn text-white" style="background-color: var(--bhel-navy-700);">Return to Dashboard</a>
  </div>
</div>
{% endblock %}
