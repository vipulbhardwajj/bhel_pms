{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div class="error-shell" style="min-height: 70vh;">
  <div>
    <div class="error-code">404</div>
    <h4 class="mb-2">Page Not Found</h4>
    <p class="text-muted">The page you are looking for does not exist or has been moved.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn text-white" style="background-color: var(--bhel-navy-700);">Return to Dashboard</a>
  </div>
</div>
{% endblock %}
