{% extends "base.html" %}
{% block title %}Access Denied{% endblock %}
{% block content %}
<div class="error-shell" style="min-height: 70vh;">
  <div>
    <div class="error-code">403</div>
    <h4 class="mb-2">Access Denied</h4>
    <p class="text-muted">You do not have sufficient permissions to view this page.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn text-white" style="background-color: var(--bhel-navy-700);">Return to Dashboard</a>
  </div>
</div>
{% endblock %}
